<html><body>
  <p>§ 431:15-304 Actions by and against rehabilitator. (a) Any court in this State before which an action is pending shall stay the action.</p>
  <p>(b) The rehabilitator may intervene in the action.</p>
  <p>History</p>
  <p>[L 1987, c 347, §10]</p>
